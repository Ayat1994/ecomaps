name: Ежедневный отчёт в Telegram

on:
  schedule:
    - cron: '17 3 * * *'   # каждый день в 08:17 по Астане (в понедельник — ещё и отчёт за неделю)
  workflow_dispatch:         # кнопка «Run workflow» для ручного запуска
    inputs:
      week:
        description: 'Отправить и отчёт за неделю'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/reports
      - name: Собрать и отправить отчёт
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          OPENAI_ADS_API_KEY: ${{ secrets.OPENAI_ADS_API_KEY }}
          META_TOKEN: ${{ secrets.META_TOKEN }}
          META_AD_ACCOUNT: ${{ secrets.META_AD_ACCOUNT }}
          YANDEX_TOKEN: ${{ secrets.YANDEX_TOKEN }}
          DIRECT_CLIENT_LOGIN: ${{ secrets.DIRECT_CLIENT_LOGIN }}
          REPORT_WEEK: ${{ inputs.week && '1' || '' }}
        run: python3 .github/reports/daily_report.py
