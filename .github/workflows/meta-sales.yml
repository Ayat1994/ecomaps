name: Продажи МойСклад → Meta

on:
  schedule:
    - cron: '7 * * * *'      # каждый час
  workflow_dispatch:
    inputs:
      test_code:
        description: 'Код тестовых событий из Events Manager (для проверки, необязательно)'
        required: false
        default: ''
      hours:
        description: 'За сколько часов взять заказы (по умолчанию 3)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/reports
      - name: Отправить продажи в Meta
        env:
          MOYSKLAD_TOKEN: ${{ secrets.MOYSKLAD_TOKEN }}
          META_CAPI_TOKEN: ${{ secrets.META_CAPI_TOKEN }}
          META_TEST_CODE: ${{ inputs.test_code }}
          LOOKBACK_HOURS: ${{ inputs.hours }}
        run: python3 .github/reports/meta_sales.py
