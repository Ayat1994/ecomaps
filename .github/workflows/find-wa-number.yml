name: 'Поиск номера WhatsApp в рекламе Meta'
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/reports
      - name: Поиск
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python3 .github/reports/find_wa_number.py
